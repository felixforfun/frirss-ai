name: FriRSSNative
options:
  bundleIdPrefix: de.felixmotzko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FriRSS:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FriRSS
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - frirss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.felixmotzko.frirss
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  FriRSSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - target: FriRSS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.felixmotzko.frirss.widget
        INFOPLIST_KEY_CFBundleDisplayName: FriRSS Widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
