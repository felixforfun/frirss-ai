name: Publish UAT image to GHCR

# UAT (testing) image — NEVER `latest` nor `dev`: the dedicated
# `uat-publisher-preview` tag is the one the Unraid test container
# (`frirss-testing`) pulls. Production deployment remains a manual act.
on:
  push:
    branches: ['feat/publisher-preview-subscribe']
  workflow_dispatch: {}

jobs:
  publish-uat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: ghcr.io/dockerhub-mirror/tonistiigi__binfmt:latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=ghcr.io/dockerhub-mirror/moby__buildkit:buildx-stable-1

      # Fixed UAT tag + one traceability tag per commit.
      - name: Compute image tags
        id: tags
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "tags=$IMAGE:uat-publisher-preview,$IMAGE:uat-publisher-preview-sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Tags: $IMAGE:uat-publisher-preview,$IMAGE:uat-publisher-preview-sha-${GITHUB_SHA::7}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
